  <div class="main-content">
    <div class="loan-box">
        <h3>I want to get a loan for:</h3>

        <div class="amount-box">
             ₦<span id="amount">1000</span>
        </div>

        <div class="slider-wrap">
            <button id="minus">−</button>

            <input type="range" id="slider" min="1000" max="1000000" step="100" value="1000">

            <button id="plus">+</button>
        </div>

        <div class="table">
            <div class="row header">
                <span>Term</span>
                <span>APR</span>
                <span>Monthly cost</span>
            </div>

            <div id="results"></div>
        </div>

        <button class="cta">Get my personalised rates</button>
    </div>

    </div>
